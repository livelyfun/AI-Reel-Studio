name: Build Fedora RPM

on:
  workflow_call:
    outputs:
      rpm-artifact-name:
        description: "Name of the uploaded RPM artifact"
        value: "fedora-rpm"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rpm:
    name: Build Fedora RPM Package
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install build and packaging dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc \
            meson \
            ninja-build \
            rpm-build \
            rpmlint \
            tar \
            gzip \
            pkgconf-pkg-config \
            gtk4-devel \
            glib2-devel \
            json-glib-devel \
            sqlite-devel \
            libsecret-devel \
            libcurl-devel \
            gstreamer1-devel \
            gstreamer1-plugins-base-devel \
            desktop-file-utils \
            libappstream-glib

      - name: Generate distribution source archive
        run: |
          # Write tarball outside the source tree so tar does not see its own output
          tar --exclude='.git' --exclude='build*' --exclude='output' \
            --transform 's,^\./,ai-reel-1.0.0/,' \
            -czf /tmp/ai-reel-1.0.0.tar.gz .
          ls -la /tmp/ai-reel-1.0.0.tar.gz

      - name: Setup RPM build tree
        run: |
          mkdir -p ~/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp /tmp/ai-reel-1.0.0.tar.gz ~/rpmbuild/SOURCES/
          cp packaging/rpm/ai-reel-studio.spec ~/rpmbuild/SPECS/

      - name: Build binary and source RPMs
        run: rpmbuild -ba ~/rpmbuild/SPECS/ai-reel-studio.spec

      - name: Lint spec and RPM packages
        run: |
          rpmlint ~/rpmbuild/SPECS/ai-reel-studio.spec
          rpmlint ~/rpmbuild/RPMS/x86_64/ai-reel-studio-1.0.0-*.rpm

      - name: Verify package installation
        run: |
          dnf install -y ~/rpmbuild/RPMS/x86_64/ai-reel-studio-1.0.0-*.rpm
          rpm -qi ai-reel-studio
          /usr/bin/ai-reel --help

      - name: Stage RPM artifacts for upload
        run: |
          mkdir -p output
          cp ~/rpmbuild/RPMS/x86_64/ai-reel-studio-1.0.0-*.x86_64.rpm output/
          cp ~/rpmbuild/SRPMS/ai-reel-studio-1.0.0-*.src.rpm output/

      - name: Upload RPM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fedora-rpm
          path: output/*.rpm
          if-no-files-found: error
