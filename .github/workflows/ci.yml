name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Build & Test (Fedora 44)
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc \
            meson \
            ninja-build \
            pkgconf-pkg-config \
            gtk4-devel \
            glib2-devel \
            json-glib-devel \
            sqlite-devel \
            libsecret-devel \
            libcurl-devel \
            gstreamer1-devel \
            gstreamer1-plugins-base-devel \
            desktop-file-utils \
            libappstream-glib

      - name: Configure Meson build
        run: meson setup build -Dwarning_level=2

      - name: Compile C17 source
        run: ninja -C build

      - name: Execute automated test suites
        run: meson test -C build --print-errorlogs

      - name: Validate desktop file specification
        run: desktop-file-validate data/ai-reel.desktop

      - name: Validate AppStream metainfo specification
        run: appstream-util validate-relax --nonet data/org.aireelstudio.AiReelStudio.metainfo.xml

