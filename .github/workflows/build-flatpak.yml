name: Build Flatpak Bundle

on:
  workflow_call:
    outputs:
      flatpak-artifact-name:
        description: "Name of the uploaded Flatpak artifact"
        value: "flatpak-bundle"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-flatpak:
    name: Build Flatpak Bundle (GNOME 47)
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Flatpak application bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@487de5b3c3c2f168f18cfdb15d023b6b1ccf7f2b # v1.4
        with:
          bundle: org.aireelstudio.AiReelStudio.flatpak
          manifest-path: packaging/flatpak/org.aireelstudio.AiReelStudio.json
          stop-at: ""
          cache: false

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99ba8edd # v4.6.1
        with:
          name: flatpak-bundle
          path: org.aireelstudio.AiReelStudio.flatpak
          if-no-files-found: error

