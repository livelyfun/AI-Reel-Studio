name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  ci-check:
    name: Run Test & Quality Gate
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc meson ninja-build pkgconf-pkg-config \
            gtk4-devel glib2-devel json-glib-devel sqlite-devel \
            libsecret-devel libcurl-devel gstreamer1-devel \
            gstreamer1-plugins-base-devel desktop-file-utils libappstream-glib

      - name: Build & Run Automated Tests
        run: |
          meson setup build
          ninja -C build
          meson test -C build --print-errorlogs
          desktop-file-validate data/ai-reel.desktop
          appstream-util validate-relax --nonet data/org.aireelstudio.AiReelStudio.metainfo.xml

  build-rpm:
    name: Build Fedora RPM
    needs: [ci-check]
    uses: ./.github/workflows/build-rpm.yml

  build-flatpak:
    name: Build Flatpak Bundle
    needs: [ci-check]
    uses: ./.github/workflows/build-flatpak.yml

  publish-release:
    name: Publish GitHub Release
    needs: [build-rpm, build-flatpak]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create release asset staging directory
        run: mkdir -p release_assets

      - name: Download RPM Artifacts
        uses: actions/download-artifact@v4
        with:
          name: fedora-rpm
          path: release_assets/

      - name: Download Flatpak Artifact
        uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle
          path: release_assets/

      - name: Generate SHA-256 Checksums
        working-directory: release_assets
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: "AI Reel Studio ${{ github.ref_name || inputs.tag_name }}"
          body_path: dist/release-notes/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: release_assets/*
